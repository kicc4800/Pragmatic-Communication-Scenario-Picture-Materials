<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幼兒語用情境圖片 Prompt 生成器</title><style>body{font-family:system-ui,'Noto Sans TC',sans-serif;background:#f7f4ef;color:#302d29;margin:0}main{max-width:920px;margin:auto;padding:30px 18px}h1{font-size:28px}p{line-height:1.7;color:#635d55}.panel{background:white;border:1px solid #e6ded4;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 3px 12px #00000008}label{display:block;font-weight:650;margin:14px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cfc7be;border-radius:9px;font:inherit;background:white}textarea{min-height:78px}button{border:0;border-radius:9px;padding:12px 18px;background:#71624c;color:white;font-weight:700;cursor:pointer;margin:8px 8px 0 0}.secondary{background:#e7e0d6;color:#302d29}pre{white-space:pre-wrap;word-break:break-word;font:15px/1.75 system-ui;background:#faf9f7;border:1px solid #e5dfd7;padding:18px;border-radius:12px}small{color:#6d665d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}@media(max-width:650px){.grid{display:block}}</style></head><body><main><h1>幼兒語用情境圖片生成器</h1><p>選擇語用目標，輸入生活情境與客製化需求，產生符合八項畫面設計架構的完整 AI 繪圖提示語。本頁可離線使用；圖片生成需另開 AI 繪圖服務。</p><section class="panel"><div class="grid"><div><label>語用情境</label><select id="cat"><option>請求與獲得</option><option>拒絕與表達立場</option><option>互動輪替</option><option>啟動與維持對話</option><option>衝突處理</option></select></div><div><label>圖片形式</label><select id="mode"><option>單張情境圖片</option><option>連續性情境圖片</option></select></div><div><label>具體語用目標</label><input id="goal" placeholder="例如：主動向老師請求圖畫紙"></div><div><label>場景</label><input id="setting" placeholder="例如：幼兒園教室美勞活動"></div><div><label>人物與數量</label><input id="people" placeholder="例如：一位老師、主角幼兒、三位同儕"></div><div><label>主要事件與動作</label><input id="action" placeholder="例如：老師發紙，主角伸手請求"></div><div><label>表情與視線</label><input id="expression" placeholder="例如：主角期待地看向老師"></div><div><label>溝通動機</label><input id="intent" placeholder="例如：其他人有紙，主角還沒有"></div><div><label>事件結果（可留白）</label><input id="outcome" placeholder="例如：老師回應請求"></div><div><label>畫面比例</label><select id="ratio"><option>15:8 橫式</option><option>3:2 橫式</option><option>1:1 正方形</option><option>2:3 直式</option></select></div></div><label>客製化內容（可留白）</label><textarea id="custom" placeholder="例如：使用積木區、減少背景人物、改成孩子熟悉的玩具"></textarea><label>必須保留或避免的細節（可留白）</label><textarea id="constraints" placeholder="例如：主角桌上不能有圖畫紙；其他幼兒桌上要有紙"></textarea><button onclick="generate()">產生完整 Prompt</button><button class="secondary" onclick="sample()">帶入示範</button></section><section class="panel"><h2>產生的繪圖提示語</h2><pre id="result">請先填寫上方欄位，再按「產生完整 Prompt」。</pre><button onclick="copyPrompt()">複製完整 Prompt</button><button class="secondary" onclick="selectPrompt()">選取全部文字</button><p id="copyStatus" role="status" aria-live="polite"></p><button class="secondary" onclick="window.open('https://chatgpt.com/','_blank','noopener')">開啟 ChatGPT</button><button class="secondary" onclick="window.open('https://gemini.google.com/app','_blank','noopener')">開啟 Gemini</button><button class="secondary" onclick="downloadPrompt()">下載文字檔</button><p><small>提醒：此版本不會自動呼叫付費圖片 API，也不會儲存幼兒資料。請勿輸入幼兒真實姓名或敏感個資。</small></p></section></main><script>const get=id=>document.getElementById(id).value.trim();let last='';function generate(){let v=id=>get(id)||'請依實際教學需求設定';last=`請依下列規格生成適合5至6歲幼兒觀察、供發展遲緩幼兒社會溝通教學使用的情境圖片。請以語用線索清晰度、情境真實性及教學適切性為優先。\n\n1. 教學目標\n語用情境：${v('cat')}\n具體目標：${v('goal')}\n情境核心：${v('intent')}\n\n2. 場景設定（Setting）\n${v('setting')}。保留必要生活線索，避免無關物品。\n\n3. 人物設定（Characters）\n${v('people')}。人物年齡、位置及互動關係符合幼兒園生活。\n\n4. 事件與動作（Actions）\n${v('action')}。動作與物件配置須合理，目標行為清楚可見。\n\n5. 人物表情與視線（Expressions and Gaze）\n${v('expression')}。表情、視線與肢體動作須一致。\n\n6. 溝通意圖（Communicative Intention）\n${v('intent')}。透過視覺線索呈現溝通需求，不依賴圖片文字。\n\n7. 事件結果（Outcomes）\n圖片形式：${v('mode')}。${get('outcome')||'依教學目標保留事件結果供教師引導幼兒推論；若為連續性圖片則呈現合理事件順序。'}\n\n8. 畫面呈現與品質要求\n比例：${v('ratio')}。畫面自然清晰，人物比例、手部動作及物件配置符合生活常理；保留重要人物、表情、手勢及操作物件；減少背景干擾，不生成標題、對話文字或浮水印。不可裁切重要內容或拉伸變形。\n\n客製化需求：${get('custom')||'無'}\n必須保留／避免的細節：${get('constraints')||'無'}\n\n生成前請檢查：主角的溝通動機是否可從畫面辨識？人物視線、動作、表情是否一致？是否有與情境矛盾的物品？`;document.getElementById('result').textContent=last}function sample(){let data={goal:'主動向老師請求圖畫紙',setting:'幼兒園教室團體繪畫活動',people:'一位穿教保圍裙的老師、一位主角幼兒、三位同儕',action:'老師正在發放圖畫紙，其他幼兒已取得紙張，主角伸手向老師提出請求',expression:'主角期待地看向老師，老師注視主角',intent:'其他幼兒桌上已有圖畫紙，但主角桌上沒有',outcome:'保留教師是否回應的結果，供教師提問推論',custom:'清楚呈現幼兒園繪畫活動，背景適度簡化',constraints:'主角桌面絕對不能出現圖畫紙；其他幼兒桌面有圖畫紙與畫具'};for(let k in data)document.getElementById(k).value=data[k];generate()}function selectPrompt(){generate();const pre=document.getElementById('result');const range=document.createRange();range.selectNodeContents(pre);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);document.getElementById('copyStatus').textContent='已選取全部 Prompt，請按 Ctrl+C（Mac：Command+C）複製。'}async function copyPrompt(){generate();const status=document.getElementById('copyStatus');let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(last);copied=true}}catch(e){}if(!copied){const ta=document.createElement('textarea');ta.value=last;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);try{copied=document.execCommand('copy')}catch(e){}ta.remove()}status.textContent=copied?'已複製完整 Prompt（共 '+last.length+' 字元），可直接貼到 ChatGPT 或 Gemini。':'瀏覽器限制自動複製，請點「選取全部文字」，再按 Ctrl+C。';if(!copied)selectPrompt()}function downloadPrompt(){generate();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([last],{type:'text/plain;charset=utf-8'}));a.download='語用情境圖片Prompt.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}</script></body></html>
